services:
  # Local dev: `docker compose up -d db` — the Next.js dev server runs natively under Node.
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - '5433:5432'
    volumes:
      - blog_db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog']
      interval: 2s
      timeout: 3s
      retries: 20

  # Deployment: `docker compose --profile deploy up -d --build`
  app:
    profiles: ['deploy']
    build: .
    environment:
      DATABASE_URL: postgresql://blog:blog@db:5432/blog
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  blog_db:
